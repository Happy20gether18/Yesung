<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>艺声歌曲看图猜猜看</title>
  <style>
    :root{--ink:#171412;--cream:#fffaf0;--peach:#f6d7bf;--pink:#e9a18f;--gold:#dfad62}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--ink);background:var(--cream)}button{font:inherit}
    .app{height:100dvh;min-height:560px;overflow:hidden;position:relative;background:radial-gradient(circle at 5% 69%,#f3c7b9 0 8px,transparent 9px),radial-gradient(circle at 91% 44%,#f4d59f 0 9px,transparent 10px),radial-gradient(circle at 81% 83%,#efb4a8 0 7px,transparent 8px),linear-gradient(145deg,#fffdf8,#fff8ed)}
    .wash{position:absolute;width:260px;height:180px;border-radius:45%;filter:blur(7px);opacity:.35;background:#f3c7a9;pointer-events:none}.w1{left:-90px;top:-80px}.w2{right:-80px;bottom:-70px}.doodle{position:absolute;color:#b98963;font:32px/1 Georgia,serif;opacity:.75;pointer-events:none}.d1{left:3%;top:13%}.d2{right:5%;top:8%}.d3{left:5%;top:47%}.d4{right:5%;top:48%}.d5{left:12%;bottom:8%}.d6{right:15%;bottom:7%}.d7{left:20%;top:6%;color:#e5b456}.d8{right:19%;top:25%;color:#e29b8d}
    header{height:clamp(105px,16vh,150px);display:flex;align-items:center;justify-content:center;position:relative;padding:10px 16px}.heading{text-align:center;transform:translateY(9px)}.title{margin:0;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:clamp(28px,4vw,56px);font-weight:700;letter-spacing:.08em;color:#111}.subtitle{margin-top:3px;font-family:"Segoe Script","Brush Script MT",cursive;font-size:clamp(16px,2.2vw,32px);font-weight:400;color:#181411}
    .counter{position:absolute;left:7%;top:50%;transform:translateY(-50%);border:1.5px solid #e9c69a;border-radius:99px;padding:8px 25px;font-size:clamp(15px,1.7vw,22px);font-weight:700;background:#fffaf3b8}.timer-box{position:absolute;right:7%;top:17px;text-align:center;font-weight:700}.timer-label{font-size:clamp(12px,1.2vw,17px);margin-bottom:5px}.timer{display:flex;align-items:baseline;gap:3px;border:1.5px solid #d7b58b;border-radius:15px;padding:4px 15px;background:#fffaf3d9}.timer strong{font-size:clamp(35px,4vw,55px);line-height:1;color:#e87c75}.timer small{font-size:14px}
    .game{height:calc(100dvh - clamp(105px,16vh,150px));min-height:430px;display:flex;flex-direction:column;align-items:center;padding:0 clamp(50px,21vw,365px) 28px}.picture{width:min(950px,100%);flex:1;min-height:180px;max-height:min(54vh,500px);border:3px solid #e1b875;border-radius:24px;overflow:hidden;background:#111;box-shadow:0 8px 20px #72533a25;display:grid;place-items:center}.picture img{width:100%;height:100%;object-fit:contain}.missing{color:#eee;padding:20px}.options{width:min(950px,100%);display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:14px}.option{height:clamp(54px,7.5vh,72px);border:1.5px solid var(--accent);border-radius:17px;background:#fffaf5d9;display:grid;grid-template-columns:56px 1fr;align-items:center;text-align:left;padding:6px 16px 6px 10px;font-weight:600;font-size:clamp(14px,1.45vw,20px);color:#171412;cursor:pointer}.option:hover{transform:translateY(-1px);box-shadow:0 4px 10px #8e6d5320}.badge{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white;font-size:25px;font-weight:700}.option:nth-child(1){--accent:#e69b8b}.option:nth-child(2){--accent:#e5b35f}.option:nth-child(3){--accent:#d8a462}.option:nth-child(4){--accent:#e3a092}.option:disabled{cursor:default}.option.correct{background:#dff4e8;--accent:#55ad80}.option.wrong{background:#f8d9d8;--accent:#d85e64}.feedback{height:25px;margin-top:5px;font-weight:700;color:#bd615e;text-align:center}
    .start,.result{height:calc(100dvh - clamp(105px,16vh,150px));min-height:430px;display:grid;place-items:center;padding:20px}.card{text-align:center;width:min(540px,90%);padding:clamp(28px,5vw,50px);border-radius:25px;background:#fffaf4db;border:1.5px solid #e8cba9;box-shadow:0 16px 45px #9c73582b}.card h2{margin:0 0 12px;font-size:clamp(26px,3.6vw,42px)}.card p{margin:8px 0 24px}.stage-name{display:inline-block;margin-bottom:7px;padding:5px 16px;border-radius:99px;background:#f6e1cc;color:#8d5b46;font-weight:700}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.primary,.secondary{border-radius:99px;padding:14px 28px;font-weight:700;font-size:18px;cursor:pointer}.primary{border:1px solid #ca8d75;background:#dfa08c;color:white;box-shadow:0 5px 0 #c78470}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c78470}.secondary{border:1px solid #d8b898;background:#fffaf3;color:#7e5543}.score{font-size:28px}.combined{font-size:15px;color:#7e655a}
    @media(max-width:700px){.app{height:auto;min-height:100dvh;overflow:visible}header{height:140px;align-items:flex-start;padding-top:10px}.heading{transform:translateY(3px)}.title{font-size:25px}.subtitle{font-size:18px}.counter{left:14px;top:111px;padding:4px 12px;font-size:13px;white-space:nowrap}.timer-box{right:13px;top:91px}.timer-label{display:none}.timer{padding:2px 10px}.timer strong{font-size:35px}.game{height:auto;min-height:0;padding:0 12px 22px}.picture{flex:none;width:100%;height:auto;aspect-ratio:16/9;max-height:none;border-radius:17px}.options{grid-template-columns:1fr;gap:8px;margin-top:9px}.option{height:57px;grid-template-columns:48px 1fr;font-size:15px}.badge{width:38px;height:38px;font-size:21px}.feedback{font-size:14px}.start,.result{height:calc(100dvh - 140px);min-height:500px}.doodle{font-size:23px}}
    @media(max-height:720px) and (min-width:701px){header{height:100px}.title{font-size:35px}.subtitle{font-size:20px}.game{height:calc(100dvh - 100px);padding-bottom:10px}.picture{max-height:49vh}.option{height:50px}.timer strong{font-size:37px}}
  </style>
</head>
<body>
  <main class="app">
    <span class="wash w1"></span><span class="wash w2"></span>
    <span class="doodle d1">☁</span><span class="doodle d2">☆</span><span class="doodle d3">◇</span><span class="doodle d4">♡</span><span class="doodle d5">○</span><span class="doodle d6">☁</span><span class="doodle d7">★</span><span class="doodle d8">♡</span>
    <header><div class="heading"><h1 class="title">艺声歌曲看图猜猜看</h1><div class="subtitle">Happy Birthday, Yesung</div></div><div class="counter" hidden></div><div class="timer-box" hidden><div class="timer-label">倒计时</div><div class="timer"><strong>05</strong><small>秒</small></div></div></header>
    <div id="screen"></div>
  </main>
  <script src="quiz-data.js"></script>
  <script>
  (()=>{
    "use strict";
    const data=window.QUIZ_DATA,screen=document.querySelector("#screen"),counter=document.querySelector(".counter"),timerBox=document.querySelector(".timer-box"),timerText=document.querySelector(".timer strong");
    const phases={
      trial:{name:"试玩",seconds:8,music:"audio/Easy.mp3"},
      basic:{name:"基础挑战",seconds:8,ids:[1,2,5,9,10,11,13,14,18,20,22,23,25,28,29],music:"audio/Easy.mp3"},
      advanced:{name:"进阶挑战",seconds:5,ids:[3,4,6,7,8,12,15,16,17,19,21,24,26,27,30],music:"audio/Its complicated.mp3"}
    };
    const music={basic:new Audio(phases.basic.music),advanced:new Audio(phases.advanced.music)};
    Object.values(music).forEach(track=>{track.loop=true;track.volume=.06});
    let phaseKey="basic",questions=[],index=0,score=0,time=data.secondsPerQuestion,timer=null,locked=false,audio=null,basicScore=null;
    const trialQuestion={image:"images/00.webp?v=20260820",answer:"咲き誇る時を待つのは",options:["咲き誇る時を待つのは","雨のち晴れの空の色","束の間の恋","いま会いにゆきます 〜IF you〜"]};
    const validate=()=>data.questions.forEach((q,i)=>{if(q.options.length!==4)throw Error(`第 ${i+1} 题不是四个选项`);if(!q.options.includes(q.answer))throw Error(`第 ${i+1} 题选项不包含答案`);if(new Set(q.options).size!==4)throw Error(`第 ${i+1} 题有重复选项`)});
    const shuffle=list=>{const result=[...list];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result};
    function tick(){if(!audio)return;const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.type="sine";osc.frequency.setValueAtTime(950,now);osc.frequency.exponentialRampToValueAtTime(520,now+.055);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.17,now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+.09);osc.connect(gain).connect(audio.destination);osc.start(now);osc.stop(now+.1)}
    function playMusic(key){const musicKey=key==="advanced"?"advanced":"basic";Object.entries(music).forEach(([name,track])=>{if(name!==musicKey){track.pause();track.currentTime=0}});music[musicKey].play().catch(()=>{})}
    function startTrial(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();phaseKey="trial";questions=[{...trialQuestion,options:shuffle(trialQuestion.options)}];index=0;score=0;counter.hidden=false;timerBox.hidden=false;playMusic("trial");render()}
    function startPhase(key){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();phaseKey=key;questions=shuffle(phases[key].ids).slice(0,10).map(n=>{const q=data.questions[n-1];return {...q,options:shuffle(q.options)}});index=0;score=0;counter.hidden=false;timerBox.hidden=false;playMusic(key);render()}
    function preloadNext(){const next=questions[index+1];if(!next)return;const image=new Image();image.decoding="async";image.src=next.image}
    function render(){locked=false;time=phases[phaseKey].seconds;const q=questions[index];counter.textContent=`${phases[phaseKey].name} ${index+1} / ${questions.length}`;timerText.textContent=String(time).padStart(2,"0");screen.className="game";screen.innerHTML=`<div class="picture"><img src="${q.image}" alt="${phases[phaseKey].name}第 ${index+1} 题图片" decoding="async" fetchpriority="high"><p class="missing" hidden>缺少图片：${q.image}</p></div><div class="options"></div><div class="feedback" aria-live="polite"></div>`;const img=screen.querySelector("img");img.onload=preloadNext;img.onerror=()=>{img.hidden=true;img.nextElementSibling.hidden=false};const box=screen.querySelector(".options");q.options.forEach((text,n)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<span class="badge">${"ABCD"[n]}</span><span></span>`;b.lastElementChild.textContent=text;b.onclick=()=>answer(text,b,false);box.append(b)});tick();timer=setInterval(()=>{time--;timerText.textContent=String(time).padStart(2,"0");if(time>0)tick();if(time<=0)answer(null,null,true)},1000)}
    function answer(choice,button,timedOut){if(locked)return;locked=true;clearInterval(timer);const q=questions[index],buttons=[...screen.querySelectorAll(".option")];buttons.forEach((b,n)=>{b.disabled=true;if(q.options[n]===q.answer)b.classList.add("correct")});if(choice===q.answer){if(phaseKey!=="trial")score++;screen.querySelector(".feedback").textContent="答对啦！"}else{if(button)button.classList.add("wrong");screen.querySelector(".feedback").textContent=(timedOut?"时间到！":"答错啦！")+` 正确答案：${q.answer}`}setTimeout(()=>{if(phaseKey==="trial")trialComplete();else{index++;index<questions.length?render():finish()}},1100)}
    function trialComplete(){counter.hidden=true;timerBox.hidden=true;screen.className="result";screen.innerHTML=`<div class="card"><span class="stage-name">试玩完成</span><h2>准备开始正式挑战</h2><p>试玩题不计入成绩<br>基础挑战共10题，每题8秒</p><button class="primary">挑战基础题</button></div>`;screen.querySelector("button").onclick=()=>startPhase("basic")}
    function finish(){counter.hidden=true;timerBox.hidden=true;screen.className="result";if(phaseKey==="basic"){basicScore=score;screen.innerHTML=`<div class="card"><span class="stage-name">第一阶段完成</span><h2>基础挑战</h2><p class="score">答对 <strong>${score} / 10</strong> 题</p><div class="actions"><button class="primary" id="advance">进入进阶挑战</button><button class="secondary" id="retry">再玩基础</button></div></div>`;screen.querySelector("#advance").onclick=()=>startPhase("advanced");screen.querySelector("#retry").onclick=()=>startPhase("basic")}else{const total=basicScore===null?null:basicScore+score;screen.innerHTML=`<div class="card"><span class="stage-name">两阶段完成</span><h2>进阶挑战</h2><p class="score">答对 <strong>${score} / 10</strong> 题</p>${total===null?"":`<p class="combined">总成绩：${total} / 20</p>`}<div class="actions"><button class="primary" id="retry">再玩进阶</button><button class="secondary" id="home">返回开始</button></div></div>`;screen.querySelector("#retry").onclick=()=>startPhase("advanced");screen.querySelector("#home").onclick=landing}}
    function landing(){clearInterval(timer);basicScore=null;counter.hidden=true;timerBox.hidden=true;playMusic("basic");screen.className="start";screen.innerHTML=`<div class="card"><span class="stage-name">两阶段挑战</span><h2>准备好了吗？</h2><p>先试玩1题（不计分）<br>基础题库随机10题，每题8秒<br>进阶题库随机10题，每题5秒</p><button class="primary">开始试玩</button></div>`;screen.querySelector("button").onclick=startTrial}
    window.addEventListener("DOMContentLoaded",()=>music.basic.play().catch(()=>{}));
    try{validate();landing()}catch(e){screen.className="result";screen.innerHTML=`<div class="card"><h2>题库检查失败</h2><p>${e.message}</p></div>`}
  })();
  </script>
</body>
</html>
