<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每题选项核对表</title><style>body{font:16px/1.6 "Microsoft YaHei",sans-serif;margin:0;padding:28px;background:#fff7fa;color:#432f3a}main{max-width:980px;margin:auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 10px 35px #b85d7d22}h1{color:#d94e80}table{width:100%;border-collapse:collapse}th,td{border:1px solid #efd9e1;padding:10px;text-align:left;vertical-align:top}th{background:#ffe7ef}.ok{color:#087d55;font-weight:800}.bad{color:#c32222;font-weight:800}@media(max-width:700px){body{padding:10px}main{padding:12px;overflow:auto}}</style></head>
<body><main><h1>《看图猜歌名》每题选项核对表</h1><p>本页与答题页直接读取同一个 <code>quiz-data.js</code>，不会出现两份数据不一致。</p><div id="status"></div><table><thead><tr><th>题号</th><th>图片</th><th>A</th><th>B</th><th>C</th><th>D</th><th>正确答案</th><th>位置</th></tr></thead><tbody></tbody></table></main><script src="quiz-data.js"></script><script>(()=>{const d=window.QUIZ_DATA,t=document.querySelector("tbody"),errors=[];d.questions.forEach((q,i)=>{const pos=q.options.indexOf(q.answer);if(q.options.length!==4||pos<0||new Set(q.options).size!==4)errors.push(i+1);const tr=document.createElement("tr");[i+1,q.image,...q.options,q.answer,pos<0?"缺失":"ABCD"[pos]].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});t.append(tr)});const s=document.querySelector("#status");s.className=errors.length?"bad":"ok";s.textContent=errors.length?`检查失败：第 ${errors.join("、")} 题数据异常`:`检查通过：${d.questions.length} 题均为四个不重复选项，且都包含正确答案；每题 ${d.secondsPerQuestion} 秒。`})()</script></body>
</html>
